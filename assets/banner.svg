<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: url(#textGrad); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      50% { transform: scale(1.05); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.4; }
    }
    @keyframes scan {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(300px); opacity: 0; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .pulsing-ring { animation: pulse 4s infinite ease-in-out; transform-origin: center; }
    .floating-shield { animation: float 6s infinite ease-in-out; transform-origin: center; }
    .scan-line { animation: scan 3.5s infinite linear; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Glow Effect -->
  <circle cx="200" cy="160" r="250" fill="url(#glow)"/>
  <circle cx="1000" cy="160" r="200" fill="url(#glow)"/>

  <!-- Geometric Grid Background (Safety Network) -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.3">
    <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240" />
    <path d="M 200,0 L 200,320 M 400,0 L 400,320 M 600,0 L 600,320 M 800,0 L 800,320 M 1000,0 L 1000,320" />
  </g>

  <!-- Animated Dynamic Background Elements (Kept in background) -->
  <g class="floating-shield">
    <polygon points="1020,70 1090,100 1090,190 1020,240 950,190 950,100" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M 1020,95 L 1070,118 L 1070,180 L 1020,215 L 970,180 L 970,118 Z" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="1020" cy="155" r="25" fill="none" stroke="#c084fc" stroke-width="2" class="pulsing-ring"/>
    <!-- Shield Lock Icon -->
    <path d="M 1012,150 V 144 A 8,8 0 0,1 1028,144 V 150 M 1008,150 H 1032 V 166 H 1008 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Scanline effect across the firewall graphics -->
  <line x1="930" y1="100" x2="1110" y2="100" stroke="#06b6d4" stroke-width="3" class="scan-line" opacity="0.7"/>

  <!-- Left Side Graphic: Firewall Nodes -->
  <g transform="translate(80, 80)">
    <circle cx="40" cy="80" r="8" fill="#38bdf8"/>
    <circle cx="120" cy="30" r="6" fill="#818cf8"/>
    <circle cx="120" cy="130" r="6" fill="#818cf8"/>
    <line x1="40" y1="80" x2="120" y2="30" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
    <line x1="40" y1="80" x2="120" y2="130" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="25" y="65" width="30" height="30" rx="6" fill="none" stroke="#38bdf8" stroke-width="2" class="pulsing-ring"/>
  </g>

  <!-- Foreground Content: Header & Text -->
  <g transform="translate(240, 115)">
    <!-- Badge -->
    <g transform="translate(0, -35)">
      <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="110" y="18" text-anchor="middle" class="tag">🛡️ RUNTIME AI SECURITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="30" class="title">Awesome AI Safety Firewall</text>
    
    <!-- Subtitle -->
    <text x="0" y="70" class="subtitle">Curated LLM Guardrails, Prompt Injection Defenses &amp; Runtime Security</text>
  </g>
</svg>
