<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="shieldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".3"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".1"/></linearGradient><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".25"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></radialGradient></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.05);opacity:.8}}@keyframes scan{0%{transform:translateY(-100px);opacity:0}50%{opacity:.6}}@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.subtitle,.tag,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:52px;fill:url(#textGrad)}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.tag{font-weight:600;font-size:14px;fill:#38bdf8}.floating-shield,.pulsing-ring{transform-origin:center}.pulsing-ring{animation:pulse 4s infinite ease-in-out}.floating-shield{animation:float 6s infinite ease-in-out}.scan-line{animation:scan 3.5s infinite linear}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="160" r="250" fill="url(#glow)"/><circle cx="1000" cy="160" r="200" fill="url(#glow)"/><g stroke="#334155" stroke-opacity=".3" stroke-width="1"><path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240"/><path d="M 200,0 L 200,320 M 400,0 L 400,320 M 600,0 L 600,320 M 800,0 L 800,320 M 1000,0 L